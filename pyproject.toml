[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperbolic_icd10"
version = "0.1.0"
description = "Hyperbolic embeddings of the ICD-10-CM ontology and the loss-temperature confound in reconstruction MAP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "mpmath>=1.3"]

[project.optional-dependencies]
train = ["torch>=2.1", "geoopt>=0.5.1"]
notebooks = ["jupyter", "matplotlib", "tqdm", "requests"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
